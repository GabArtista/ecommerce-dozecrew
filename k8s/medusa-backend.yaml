apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa-backend
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medusa-backend
  template:
    metadata:
      labels:
        app: medusa-backend
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres..."; sleep 3;
              done
      containers:
        - name: medusa-backend
          image: ecommerce/medusa-backend:v2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 9000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "9000"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://medusa:$(POSTGRES_PASSWORD)@postgres:5432/medusa_ecommerce?sslmode=disable
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_SECRET
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: COOKIE_SECRET
            # Redis not deployed - removed to prevent connection timeout errors
            - name: STORE_CORS
              value: "https://shop.dozecrew.com,http://localhost:3000"
            - name: ADMIN_CORS
              value: "https://shop.dozecrew.com,https://shop-back.dozecrew.com,http://localhost:9000"
            - name: AUTH_CORS
              value: "https://shop.dozecrew.com,https://shop-back.dozecrew.com,http://localhost:3000"
            - name: ASAAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: ASAAS_API_KEY
            - name: ASAAS_SANDBOX
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: ASAAS_SANDBOX
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: RESEND_API_KEY
            - name: RESEND_FROM_EMAIL
              value: "noreply@sualoja.com.br"
            - name: MARKETPLACE_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_SECRET
            - name: ML_CLIENT_ID
              value: "1465478461480690"
            - name: ML_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: ML_CLIENT_SECRET
            - name: ML_REDIRECT_URI
              value: "https://shop-back.dozecrew.com/store/marketplace/oauth/callback/mercadolivre"
            - name: BACKEND_URL
              value: "https://shop-back.dozecrew.com"
            # MinIO / S3 file storage
            - name: S3_URL
              value: "https://s3.minio.dozecrew.com/ecommerce-uploads"
            - name: S3_BUCKET
              value: "ecommerce-uploads"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_ENDPOINT
              value: "http://minio.storage:9000"
            - name: S3_ACCESS_KEY_ID
              value: "admin"
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: MINIO_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "10m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: medusa-backend
  namespace: ecommerce
spec:
  selector:
    app: medusa-backend
  ports:
    - port: 80
      targetPort: 9000
